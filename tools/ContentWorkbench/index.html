<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>内容包工作台 · 地下城竞技场</title>
<style>
:root {
    --stone: #262a31;
    --panel: #2f343d;
    --raised: #3a404b;
    --line: #474e5a;
    --text: #e8e3d5;
    --dim: #a3a8b1;
    --gold: #d9ad4f;
    --gold-ink: #2a2006;
    --error: #e07a5f;
    --warn: #e2b04a;
    --ok: #7fbf7a;
    --q-D: #b4b8bf;
    --q-C: #6fcf6a;
    --q-B: #5aa9f0;
    --q-A: #b67df2;
    --q-S: #f29a3a;
    --radius: 6px;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
    background: var(--stone);
    color: var(--text);
    font: 14px/1.55 "Microsoft YaHei UI", "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", system-ui, sans-serif;
    font-variant-numeric: tabular-nums;
    display: grid;
    grid-template-rows: auto 1fr auto;
    overflow: hidden;
}
button, input, select, textarea { font: inherit; color: inherit; }
button {
    background: var(--raised);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 5px 12px;
    cursor: pointer;
}
button:hover { border-color: var(--dim); }
button.primary { background: var(--gold); border-color: var(--gold); color: var(--gold-ink); font-weight: 600; }
button.primary:hover { filter: brightness(1.08); }
button.quiet { background: none; border-color: transparent; color: var(--dim); padding: 2px 6px; }
button.quiet:hover { color: var(--text); border-color: var(--line); }
button.danger:hover { color: var(--error); border-color: var(--error); }
button:disabled { opacity: .45; cursor: default; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 1px; }
input, select, textarea {
    background: var(--stone);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 4px 8px;
    min-width: 0;
}
input::placeholder, textarea::placeholder { color: #737985; }
textarea { width: 100%; resize: vertical; }
input[type=checkbox] { width: 16px; height: 16px; accent-color: var(--gold); }
.bad { border-color: var(--error) !important; }

/* 顶栏 */
header {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 14px;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
}
header h1 { font-size: 16px; margin: 0 12px 0 0; font-weight: 600; letter-spacing: .02em; }
header .pack { color: var(--dim); margin-right: auto; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
header .pack b { color: var(--text); font-weight: 600; }
header .dirty { color: var(--gold); }

/* 三栏 */
main { display: grid; grid-template-columns: 250px minmax(420px, 1fr) 340px; min-height: 0; }
nav { border-right: 1px solid var(--line); overflow-y: auto; padding: 10px 0 30px; }
#editor { overflow-y: auto; padding: 18px 26px 60px; }
aside { border-left: 1px solid var(--line); overflow-y: auto; padding: 18px 18px 40px; background: #2a2e36; }

nav .group { margin-top: 10px; }
nav .group-head { display: flex; align-items: center; padding: 4px 10px 4px 16px; color: var(--dim); }
nav .group-head span { flex: 1; }
nav .entry {
    display: flex; align-items: center; gap: 8px;
    width: 100%; text-align: left;
    background: none; border: 0; border-left: 3px solid transparent; border-radius: 0;
    padding: 4px 12px 4px 24px;
}
nav .entry:hover { background: var(--panel); }
nav .entry.on { background: var(--raised); border-left-color: var(--gold); }
nav .entry .name { flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
nav .entry .key { color: var(--dim); font-size: 12px; }
nav .page { padding-left: 16px; font-weight: 600; }
.count { font-size: 12px; border-radius: 9px; padding: 0 6px; }
.count.e { background: var(--error); color: #2b120b; }
.count.w { background: var(--warn); color: #2b2206; }
.pip { width: 8px; height: 8px; border-radius: 2px; flex: none; background: var(--q-C); }

/* 表单 */
#editor h2 { font-size: 22px; margin: 0; font-weight: 600; }
#editor .title { display: flex; align-items: baseline; gap: 12px; margin-bottom: 4px; }
#editor .title .where { color: var(--dim); font-size: 13px; margin-right: auto; }
#editor .lead { color: var(--dim); margin: 0 0 18px; max-width: 70ch; }
fieldset { border: 0; border-top: 1px solid var(--line); margin: 18px 0 0; padding: 12px 0 0; }
legend { padding: 0 8px 0 0; font-weight: 600; color: var(--text); }
legend small { font-weight: normal; color: var(--dim); margin-left: 8px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px 16px; }
.field { display: flex; flex-direction: column; gap: 3px; }
.field.wide { grid-column: 1 / -1; }
.field > label { color: var(--dim); font-size: 13px; }
.field > label code { color: #8f95a0; font-size: 12px; margin-left: 4px; }
.field .hint { color: #8f95a0; font-size: 12px; }
.field .msg { color: var(--error); font-size: 12px; }
.field .msg.w { color: var(--warn); }
.check { flex-direction: row; align-items: center; gap: 8px; padding-top: 18px; }
.check > label { color: var(--text); font-size: 14px; }
.check { flex-wrap: wrap; }
.check > .hint, .check > .msg { flex-basis: 100%; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.chip { padding: 1px 8px; border-radius: 10px; font-size: 12px; background: var(--stone); }
.chip.on { background: var(--gold); border-color: var(--gold); color: var(--gold-ink); }
.row { display: flex; gap: 6px; align-items: center; }
.row > input { flex: 1; }

/* 效果 */
.trigger { margin: 10px 0 0; }
.trigger-head { display: flex; align-items: center; gap: 8px; }
.trigger-head b { font-weight: 600; }
.trigger-head span { color: var(--dim); font-size: 13px; margin-right: auto; }
.effect {
    display: grid; grid-template-columns: 130px 1fr auto; gap: 6px 10px; align-items: start;
    margin: 6px 0 0 14px; padding: 8px 10px;
    background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
}
.effect.has-error { border-color: var(--error); }
.effect .extras { grid-column: 2 / 3; display: flex; flex-wrap: wrap; gap: 6px 12px; }
.effect .extras .field { flex: 0 1 150px; }
.effect .tools { display: flex; gap: 2px; }
.effect .msgs { grid-column: 1 / -1; color: var(--error); font-size: 12px; }
.empty-trigger { margin: 4px 0 0 14px; color: #8f95a0; font-size: 13px; }

/* 预览卡 */
.card {
    border: 1px solid var(--line); border-top: 3px solid var(--q, var(--q-C));
    border-radius: var(--radius); background: #22262d; padding: 14px 16px;
}
.card .icon {
    float: left; width: 56px; height: 56px; margin: 0 12px 6px 0;
    border: 2px solid var(--q, var(--q-C)); border-radius: 8px; background: var(--stone);
    display: grid; place-items: center; overflow: hidden; font-size: 11px; color: var(--dim); text-align: center; word-break: break-all;
}
.card .icon img { width: 100%; height: 100%; object-fit: cover; }
.card .name { font-size: 18px; font-weight: 600; color: var(--q, var(--q-C)); }
.card .sub { color: var(--dim); font-size: 12px; }
.card .desc { clear: both; margin-top: 8px; white-space: pre-wrap; }
.card .desc em { font-style: normal; color: #ff9700; }
.card .stats { margin-top: 10px; display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; font-size: 13px; }
.card .stats dt { color: var(--dim); }
.card .stats dd { margin: 0; }
.level { display: flex; align-items: center; gap: 8px; margin-top: 10px; color: var(--dim); font-size: 13px; }
aside h3 { font-size: 14px; margin: 22px 0 8px; font-weight: 600; }
.issue { display: block; width: 100%; text-align: left; background: none; border: 0; border-left: 3px solid var(--error); border-radius: 0; padding: 3px 8px; margin: 4px 0; font-size: 13px; }
.issue.w { border-left-color: var(--warn); }
.issue:hover { background: var(--panel); }
.all-good { color: var(--ok); font-size: 13px; }

/* 底部检查栏 */
footer { border-top: 1px solid var(--line); background: var(--panel); }
footer .bar { display: flex; align-items: center; gap: 14px; padding: 5px 14px; }
footer .bar .summary { margin-right: auto; }
footer .list { max-height: 30vh; overflow-y: auto; padding: 0 14px 10px; }
footer .list[hidden] { display: none; }

/* 欢迎页 */
.welcome { max-width: 60ch; margin: 8vh auto 0; }
.welcome h2 { font-size: 26px !important; margin-bottom: 10px !important; }
.welcome p { color: var(--dim); }
.welcome .actions { display: flex; gap: 10px; margin: 22px 0; }
.welcome ol { color: var(--dim); padding-left: 20px; }
.welcome li { margin: 4px 0; }

table.lang { border-collapse: collapse; width: 100%; }
table.lang th, table.lang td { border-bottom: 1px solid var(--line); padding: 4px 6px; text-align: left; vertical-align: top; }
table.lang th { color: var(--dim); font-weight: normal; position: sticky; top: -18px; background: var(--stone); }
table.lang td.zh { color: var(--dim); max-width: 26ch; }
table.lang input, table.lang textarea { width: 100%; }
table.lang .missing { border-color: var(--warn); }

dialog { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 8px; max-width: 560px; }
dialog::backdrop { background: rgba(10, 12, 16, .6); }
dialog h3 { margin-top: 0; }
dialog .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
.toast {
    position: fixed; left: 50%; bottom: 60px; transform: translateX(-50%);
    background: var(--raised); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 8px 16px; box-shadow: 0 6px 20px rgba(0,0,0,.35);
}
.toast.error { border-color: var(--error); }

@media (max-width: 1100px) {
    main { grid-template-columns: 220px 1fr; }
    aside { display: none; }
}
@media (prefers-reduced-motion: no-preference) {
    .toast { animation: rise .18s ease-out; }
    @keyframes rise { from { opacity: 0; transform: translate(-50%, 6px); } }
}
</style>
</head>
<body>
<header>
    <h1>内容包工作台</h1>
    <div class="pack" id="packName">还没有打开内容包</div>
    <button id="btnOpen">打开文件夹</button>
    <button id="btnNew">新建内容包</button>
    <button id="btnSave" class="primary" disabled>保存</button>
    <button id="btnInstall" disabled title="把整个内容包复制到游戏的 BepInEx/content 里">复制到游戏</button>
    <button id="btnZip" disabled title="打成 zip，发给别人解压到 BepInEx/content 里">导出 zip</button>
</header>
<main>
    <nav id="nav"></nav>
    <section id="editor"></section>
    <aside id="aside"></aside>
</main>
<footer>
    <div class="bar">
        <span class="summary" id="summary"></span>
        <button class="quiet" id="btnIssues">展开检查结果</button>
    </div>
    <div class="list" id="issues" hidden></div>
</footer>
<input type="file" id="folderInput" webkitdirectory hidden>
<script src="catalog.js"></script>
<script src="validate.js"></script>
<script src="app.js"></script>
</body>
</html>
